apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-devops-app
  template:
    metadata:
      labels:
        app: flask-devops-app
    spec:
      containers:
      - name: flask-app
        image: YOUR_DOCKERHUB_USERNAME/flask-devops-app
        ports:
        - containerPort: 5000
